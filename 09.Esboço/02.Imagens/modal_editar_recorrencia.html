
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 28px 0; display: flex; justify-content: center;">
  <div style="width: 300px; background: #FFFFFF; border-radius: 22px; border: 0.5px solid var(--color-border-tertiary); overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,0.02);">

    <div style="padding: 20px 20px 4px; text-align: center;">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #FAECE7; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
        <i class="ti ti-repeat" style="font-size: 22px; color: #791F1F;" aria-hidden="true"></i>
      </div>
      <p style="font-size: 14.5px; font-weight: 600; color: #1A1A18; margin: 0 0 6px;">esta é uma aula recorrente</p>
      <p style="font-size: 12px; color: #6B6A66; margin: 0 0 18px; line-height: 1.4;">como queres aplicar esta alteração?</p>
    </div>

    <div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px;">

      <button style="width: 100%; background: #F6F5F1; border: 0.5px solid var(--color-border-tertiary); border-radius: 12px; padding: 12px 14px; text-align: left;">
        <p style="font-size: 13px; font-weight: 600; color: #1A1A18; margin: 0;">só esta aula</p>
        <p style="font-size: 10.5px; color: #6B6A66; margin: 2px 0 0;">altera apenas o dia 24/06, as restantes mantêm-se</p>
      </button>

      <button style="width: 100%; background: #F6F5F1; border: 0.5px solid var(--color-border-tertiary); border-radius: 12px; padding: 12px 14px; text-align: left;">
        <p style="font-size: 13px; font-weight: 600; color: #1A1A18; margin: 0;">todas as aulas desta recorrência</p>
        <p style="font-size: 10.5px; color: #6B6A66; margin: 2px 0 0;">aplica a alteração a todas as ocorrências, passadas e futuras</p>
      </button>

      <button style="width: 100%; background: #FAECE7; border: 0.5px solid #E8C9BE; border-radius: 12px; padding: 12px 14px; text-align: left;">
        <p style="font-size: 13px; font-weight: 600; color: #791F1F; margin: 0;">criar nova recorrência a partir de hoje</p>
        <p style="font-size: 10.5px; color: #92453F; margin: 2px 0 0;">termina a recorrência atual no dia anterior e inicia uma nova com estas alterações</p>
      </button>

      <button style="width: 100%; background: transparent; border: none; padding: 10px 0; margin-top: 2px;">
        <p style="font-size: 12.5px; color: #B4B2A9; text-align: center; margin: 0;">cancelar</p>
      </button>

    </div>
  </div>
</div>
