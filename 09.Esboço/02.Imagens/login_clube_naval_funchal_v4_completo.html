
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 28px 0; display: flex; justify-content: center;">
  <div style="width: 320px; background: #FFFFFF; border-radius: 28px; border: 0.5px solid var(--color-border-tertiary); overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,0.02);">

    <div style="background: #0A1F3D; padding: 30px 24px 24px; display: flex; flex-direction: column; align-items: center;">
      <div style="width: 84px; height: 84px; border-radius: 50%; background: #12305A; border: 2.5px solid #C9A24B; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
        <i class="ti ti-anchor" style="font-size: 36px; color: #C9A24B;" aria-hidden="true"></i>
      </div>
      <p style="font-size: 17px; color: #FFFFFF; font-weight: 500; margin: 0;">clube naval do funchal</p>
      <p style="font-size: 12px; color: rgba(255,255,255,0.35); margin: 4px 0 0;">introduz o id para continuar</p>
    </div>

    <div style="padding: 22px 24px 26px;">

      <div style="margin-bottom: 18px;">
        <label style="font-size: 11px; color: var(--color-text-secondary); display: block; margin-bottom: 6px; padding-left: 2px;">id do atleta ou treinador</label>
        <div style="display: flex; align-items: center; gap: 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; background: var(--color-background-secondary);">
          <i class="ti ti-anchor" style="font-size: 17px; color: #0A1F3D;" aria-hidden="true"></i>
          <span style="font-size: 14px; color: var(--color-text-tertiary);">ex: CNF-2381</span>
        </div>
      </div>

      <div style="margin-bottom: 22px;">
        <label style="font-size: 11px; color: var(--color-text-secondary); display: block; margin-bottom: 6px; padding-left: 2px;">palavra-passe</label>
        <div style="display: flex; align-items: center; gap: 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; background: var(--color-background-secondary);">
          <i class="ti ti-lock" style="font-size: 17px; color: #0A1F3D;" aria-hidden="true"></i>
          <span style="font-size: 14px; color: var(--color-text-tertiary);">••••••••</span>
          <i class="ti ti-eye" style="font-size: 16px; color: var(--color-text-tertiary); margin-left: auto;" aria-hidden="true"></i>
        </div>
      </div>

      <button style="width: 100%; background: #0A1F3D; color: #FFFFFF; border: none; border-radius: 14px; padding: 13px 0; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px;">
        entrar
        <i class="ti ti-arrow-right" style="font-size: 17px;" aria-hidden="true"></i>
      </button>

      <p style="text-align: center; font-size: 12.5px; color: var(--color-text-secondary); margin: 16px 0 0;">
        não tens conta? <span style="color: #C9A24B; font-weight: 500;">faça sign in</span>
      </p>

    </div>
  </div>
</div>
