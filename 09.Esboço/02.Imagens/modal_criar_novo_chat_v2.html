
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 28px 0; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;">

  <div style="width: 300px; background: #FFFFFF; border-radius: 24px; border: 0.5px solid var(--color-border-tertiary); overflow: hidden;">
    <div style="padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--color-border-tertiary);">
      <i class="ti ti-x" style="font-size: 20px; color: #0A1F3D;" aria-hidden="true"></i>
      <p style="font-size: 14px; font-weight: 600; color: #1A1A18; margin: 0;">nova conversa</p>
      <div style="width: 20px;"></div>
    </div>

    <div style="padding: 16px;">
      <p style="font-size: 11px; color: #6B6A66; font-weight: 600; letter-spacing: 0.4px; margin: 0 2px 10px;">com quem queres falar?</p>

      <button style="width: 100%; display: flex; align-items: center; gap: 12px; background: #F6F5F1; border: none; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; text-align: left;">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #FAECE7; display: flex; align-items: center; justify-content: center;">
          <i class="ti ti-user" style="font-size: 18px; color: #791F1F;" aria-hidden="true"></i>
        </div>
        <div style="flex: 1;">
          <p style="font-size: 13px; font-weight: 600; color: #1A1A18; margin: 0;">um utilizador</p>
          <p style="font-size: 10.5px; color: #6B6A66; margin: 1px 0 0;">qualquer atleta ou treinador do clube</p>
        </div>
        <i class="ti ti-chevron-right" style="font-size: 16px; color: #B4B2A9;" aria-hidden="true"></i>
      </button>

      <button style="width: 100%; display: flex; align-items: center; gap: 12px; background: #F6F5F1; border: none; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; text-align: left;">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #E8F0FA; display: flex; align-items: center; justify-content: center;">
          <i class="ti ti-users" style="font-size: 18px; color: #185FA5;" aria-hidden="true"></i>
        </div>
        <div style="flex: 1;">
          <p style="font-size: 13px; font-weight: 600; color: #1A1A18; margin: 0;">grupo de pessoas</p>
          <p style="font-size: 10.5px; color: #6B6A66; margin: 1px 0 0;">escolher várias pessoas manualmente</p>
        </div>
        <i class="ti ti-chevron-right" style="font-size: 16px; color: #B4B2A9;" aria-hidden="true"></i>
      </button>

      <button style="width: 100%; display: flex; align-items: center; gap: 12px; background: #F6F5F1; border: none; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; text-align: left;">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #FFF8E8; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 26 26" fill="none">
            <path d="M5 19 C 9 11, 16 6, 22 4 C 21 10, 16 17, 8 21 C 6.5 21.5, 5.5 20.5, 5 19 Z" fill="#92660E"/>
          </svg>
        </div>
        <div style="flex: 1;">
          <p style="font-size: 13px; font-weight: 600; color: #1A1A18; margin: 0;">modalidade</p>
          <p style="font-size: 10.5px; color: #6B6A66; margin: 1px 0 0;">todos os atletas de uma modalidade</p>
        </div>
        <i class="ti ti-chevron-right" style="font-size: 16px; color: #B4B2A9;" aria-hidden="true"></i>
      </button>

      <button style="width: 100%; display: flex; align-items: center; gap: 12px; background: #F6F5F1; border: none; border-radius: 12px; padding: 12px 14px; text-align: left;">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #EAF3DE; display: flex; align-items: center; justify-content: center;">
          <i class="ti ti-calendar-event" style="font-size: 18px; color: #27500A;" aria-hidden="true"></i>
        </div>
        <div style="flex: 1;">
          <p style="font-size: 13px; font-weight: 600; color: #1A1A18; margin: 0;">pessoas de uma aula</p>
          <p style="font-size: 10.5px; color: #6B6A66; margin: 1px 0 0;">alunos confirmados numa aula específica</p>
        </div>
        <i class="ti ti-chevron-right" style="font-size: 16px; color: #B4B2A9;" aria-hidden="true"></i>
      </button>

    </div>
  </div>

  <div style="width: 280px; background: #FFFFFF; border-radius: 24px; border: 0.5px solid var(--color-border-tertiary); overflow: hidden;">
    <div style="padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--color-border-tertiary);">
      <i class="ti ti-chevron-left" style="font-size: 20px; color: #0A1F3D;" aria-hidden="true"></i>
      <p style="font-size: 13.5px; font-weight: 600; color: #1A1A18; margin: 0;">modalidade: surf</p>
      <div style="width: 20px;"></div>
    </div>

    <div style="padding: 18px 16px;">
      <p style="font-size: 11px; color: #6B6A66; font-weight: 600; letter-spacing: 0.4px; margin: 0 2px 12px;">o que queres criar?</p>

      <button style="width: 100%; background: #F6F5F1; border: 0.5px solid var(--color-border-tertiary); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; text-align: left;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
          <i class="ti ti-users" style="font-size: 16px; color: #185FA5;" aria-hidden="true"></i>
          <p style="font-size: 13px; font-weight: 600; color: #1A1A18; margin: 0;">grupo</p>
        </div>
        <p style="font-size: 10.5px; color: #6B6A66; margin: 0; line-height: 1.4;">cria uma conversa onde todos podem escrever e ver as mensagens uns dos outros</p>
      </button>

      <button style="width: 100%; background: #FFF8E8; border: 0.5px solid #EDD9A3; border-radius: 12px; padding: 13px 14px; text-align: left;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
          <i class="ti ti-speakerphone" style="font-size: 16px; color: #92660E;" aria-hidden="true"></i>
          <p style="font-size: 13px; font-weight: 600; color: #92660E; margin: 0;">aviso</p>
        </div>
        <p style="font-size: 10.5px; color: #92660E; margin: 0; line-height: 1.4;">envia uma notificação para o chat "avisos"; só tu podes publicar, mas todos podem responder</p>
      </button>
    </div>
  </div>

</div>
