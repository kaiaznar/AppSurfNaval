
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 28px 0; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;">

  <div style="width: 300px; background: #00000055; border-radius: 24px; padding: 0; display: flex; align-items: flex-end; height: 420px; overflow: hidden; position: relative;">
    <div style="width: 100%; background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 16px 18px 20px;">
      <div style="width: 36px; height: 4px; background: #E4E2DA; border-radius: 4px; margin: 0 auto 14px;"></div>
      <p style="font-size: 14px; font-weight: 600; color: #1A1A18; margin: 0 0 14px; text-align: center;">alterar data</p>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
        <i class="ti ti-chevron-left" style="font-size: 18px; color: #6B6A66;" aria-hidden="true"></i>
        <p style="font-size: 13px; font-weight: 600; color: #1A1A18; margin: 0;">junho 2026</p>
        <i class="ti ti-chevron-right" style="font-size: 18px; color: #6B6A66;" aria-hidden="true"></i>
      </div>

      <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; margin-bottom: 14px;">
        <span style="font-size: 10px; color: #B4B2A9;">D</span><span style="font-size: 10px; color: #B4B2A9;">S</span><span style="font-size: 10px; color: #B4B2A9;">T</span><span style="font-size: 10px; color: #B4B2A9;">Q</span><span style="font-size: 10px; color: #B4B2A9;">Q</span><span style="font-size: 10px; color: #B4B2A9;">S</span><span style="font-size: 10px; color: #B4B2A9;">S</span>
        <span style="font-size: 12px; color: #C7C5BC; padding: 6px 0;">21</span><span style="font-size: 12px; color: #C7C5BC; padding: 6px 0;">22</span><span style="font-size: 12px; color: #1A1A18; padding: 6px 0;">23</span>
        <span style="font-size: 12px; color: #FFFFFF; background: #0A1F3D; border-radius: 50%; padding: 6px 0; font-weight: 600;">24</span>
        <span style="font-size: 12px; color: #1A1A18; padding: 6px 0;">25</span><span style="font-size: 12px; color: #1A1A18; padding: 6px 0;">26</span><span style="font-size: 12px; color: #1A1A18; padding: 6px 0;">27</span>
      </div>

      <button style="width: 100%; background: #0A1F3D; border: none; border-radius: 12px; padding: 12px 0; font-size: 13.5px; font-weight: 600; color: #FFFFFF;">confirmar data</button>
    </div>
  </div>

  <div style="width: 300px; background: #00000055; border-radius: 24px; padding: 0; display: flex; align-items: flex-end; height: 420px; overflow: hidden; position: relative;">
    <div style="width: 100%; background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 16px 18px 20px;">
      <div style="width: 36px; height: 4px; background: #E4E2DA; border-radius: 4px; margin: 0 auto 14px;"></div>
      <p style="font-size: 14px; font-weight: 600; color: #1A1A18; margin: 0 0 16px; text-align: center;">alterar hora</p>

      <div style="display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 20px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <i class="ti ti-chevron-up" style="font-size: 16px; color: #B4B2A9;" aria-hidden="true"></i>
          <p style="font-size: 13px; color: #C7C5BC; margin: 2px 0;">16</p>
          <p style="font-size: 22px; font-weight: 700; color: #0A1F3D; margin: 2px 0;">17</p>
          <p style="font-size: 13px; color: #C7C5BC; margin: 2px 0;">18</p>
          <i class="ti ti-chevron-down" style="font-size: 16px; color: #B4B2A9;" aria-hidden="true"></i>
        </div>
        <p style="font-size: 20px; font-weight: 700; color: #1A1A18; margin: 0;">:</p>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <i class="ti ti-chevron-up" style="font-size: 16px; color: #B4B2A9;" aria-hidden="true"></i>
          <p style="font-size: 13px; color: #C7C5BC; margin: 2px 0;">45</p>
          <p style="font-size: 22px; font-weight: 700; color: #0A1F3D; margin: 2px 0;">00</p>
          <p style="font-size: 13px; color: #C7C5BC; margin: 2px 0;">15</p>
          <i class="ti ti-chevron-down" style="font-size: 16px; color: #B4B2A9;" aria-hidden="true"></i>
        </div>
      </div>

      <button style="width: 100%; background: #0A1F3D; border: none; border-radius: 12px; padding: 12px 0; font-size: 13.5px; font-weight: 600; color: #FFFFFF;">confirmar hora</button>
    </div>
  </div>

</div>
