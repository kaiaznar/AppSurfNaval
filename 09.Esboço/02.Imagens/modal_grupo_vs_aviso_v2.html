
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 28px 0; display: flex; justify-content: center;">
  <div style="width: 280px; background: #FFFFFF; border-radius: 24px; border: 0.5px solid var(--color-border-tertiary); overflow: hidden;">
    <div style="padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--color-border-tertiary);">
      <i class="ti ti-chevron-left" style="font-size: 20px; color: #0A1F3D;" aria-hidden="true"></i>
      <p style="font-size: 13.5px; font-weight: 600; color: #1A1A18; margin: 0;">modalidade: surf</p>
      <div style="width: 20px;"></div>
    </div>

    <div style="padding: 18px 16px;">
      <p style="font-size: 11px; color: #6B6A66; font-weight: 600; letter-spacing: 0.4px; margin: 0 2px 12px;">o que queres criar?</p>

      <button style="width: 100%; background: #F6F5F1; border: 0.5px solid var(--color-border-tertiary); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; text-align: left;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
          <i class="ti ti-users" style="font-size: 16px; color: #185FA5;" aria-hidden="true"></i>
          <p style="font-size: 13px; font-weight: 600; color: #1A1A18; margin: 0;">grupo</p>
        </div>
        <p style="font-size: 10.5px; color: #6B6A66; margin: 0; line-height: 1.4;">cria uma conversa onde todos podem escrever e ver as mensagens uns dos outros</p>
      </button>

      <button style="width: 100%; background: #FFF8E8; border: 0.5px solid #EDD9A3; border-radius: 12px; padding: 13px 14px; text-align: left;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
          <i class="ti ti-speakerphone" style="font-size: 16px; color: #92660E;" aria-hidden="true"></i>
          <p style="font-size: 13px; font-weight: 600; color: #92660E; margin: 0;">aviso</p>
        </div>
        <p style="font-size: 10.5px; color: #92660E; margin: 0; line-height: 1.4;">envia uma notificação para o chat "avisos"; ninguém pode responder, é só leitura</p>
      </button>
    </div>
  </div>
</div>
