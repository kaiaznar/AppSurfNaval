
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 28px 0; display: flex; justify-content: center;">
  <div style="width: 340px; background: #F6F5F1; border-radius: 28px; border: 0.5px solid var(--color-border-tertiary); overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,0.02);">

    <div style="background: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--color-border-tertiary);">
      <i class="ti ti-x" style="font-size: 22px; color: #0A1F3D;" aria-hidden="true"></i>
      <p style="font-size: 15px; font-weight: 500; color: #1A1A18; margin: 0;">editar perfil</p>
      <span style="font-size: 13px; font-weight: 600; color: #791F1F;">guardar</span>
    </div>

    <div style="padding: 22px 16px 8px; display: flex; flex-direction: column; align-items: center;">
      <div style="position: relative;">
        <div style="width: 78px; height: 78px; border-radius: 50%; background: #0A1F3D; display: flex; align-items: center; justify-content: center; border: 2.5px solid #C9A24B;">
          <i class="ti ti-anchor" style="font-size: 32px; color: #C9A24B;" aria-hidden="true"></i>
        </div>
        <div style="position: absolute; bottom: -2px; right: -2px; width: 26px; height: 26px; border-radius: 50%; background: #791F1F; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center;">
          <i class="ti ti-camera" style="font-size: 13px; color: #FFFFFF;" aria-hidden="true"></i>
        </div>
      </div>
      <p style="font-size: 12px; color: #791F1F; margin: 10px 0 0; font-weight: 500;">alterar foto</p>
    </div>

    <div style="padding: 8px 16px 16px;">

      <p style="font-size: 11px; color: #6B6A66; font-weight: 500; margin: 14px 0 8px; padding-left: 2px; letter-spacing: 0.3px;">dados pessoais</p>
      <div style="background: #FFFFFF; border-radius: 14px; border: 0.5px solid var(--color-border-tertiary); overflow: hidden;">

        <div style="padding: 10px 14px;">
          <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 4px;">nome <span style="color: #791F1F;">*</span></p>
          <input type="text" value="Maria Sousa" style="width: 100%; border: none; font-size: 13.5px; color: #1A1A18; background: transparent; padding: 0;" />
        </div>

        <div style="padding: 10px 14px; border-top: 0.5px solid var(--color-border-tertiary);">
          <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 4px;">data de nascimento <span style="color: #791F1F;">*</span></p>
          <input type="text" value="14/03/2014" style="width: 100%; border: none; font-size: 13.5px; color: #1A1A18; background: transparent; padding: 0;" />
        </div>

        <div style="padding: 10px 14px; border-top: 0.5px solid var(--color-border-tertiary);">
          <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 4px;">telemóvel <span style="color: #791F1F;">*</span></p>
          <input type="text" value="+351 912 345 678" style="width: 100%; border: none; font-size: 13.5px; color: #1A1A18; background: transparent; padding: 0;" />
        </div>

        <div style="padding: 10px 14px; border-top: 0.5px solid var(--color-border-tertiary);">
          <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 4px;">email <span style="color: #791F1F;">*</span></p>
          <input type="text" value="maria.sousa@email.com" style="width: 100%; border: none; font-size: 13.5px; color: #1A1A18; background: transparent; padding: 0;" />
        </div>

        <div style="padding: 10px 14px; border-top: 0.5px solid var(--color-border-tertiary);">
          <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 4px;">instagram <span style="color: #B4B2A9;">(opcional)</span></p>
          <input type="text" value="@maria.surf" style="width: 100%; border: none; font-size: 13.5px; color: #1A1A18; background: transparent; padding: 0;" />
        </div>

        <div style="padding: 10px 14px; border-top: 0.5px solid var(--color-border-tertiary);">
          <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 4px;">morada <span style="color: #791F1F;">*</span></p>
          <input type="text" value="Rua das Maravilhas, nº12, Funchal" style="width: 100%; border: none; font-size: 13.5px; color: #1A1A18; background: transparent; padding: 0;" />
        </div>

      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; padding-left: 2px;">
        <p style="font-size: 11px; color: #6B6A66; font-weight: 500; letter-spacing: 0.3px; margin: 0;">responsável 1</p>
        <i class="ti ti-trash" style="font-size: 15px; color: #B4B2A9;" aria-hidden="true"></i>
      </div>
      <div style="background: #FFFFFF; border-radius: 14px; border: 0.5px solid var(--color-border-tertiary); overflow: hidden; margin-bottom: 10px;">

        <div style="padding: 10px 14px;">
          <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 4px;">nome do responsável <span style="color: #791F1F;">*</span></p>
          <input type="text" value="Carla Sousa" style="width: 100%; border: none; font-size: 13.5px; color: #1A1A18; background: transparent; padding: 0;" />
        </div>

        <div style="padding: 10px 14px; border-top: 0.5px solid var(--color-border-tertiary);">
          <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 4px;">telefone do responsável <span style="color: #791F1F;">*</span></p>
          <input type="text" value="+351 963 210 987" style="width: 100%; border: none; font-size: 13.5px; color: #1A1A18; background: transparent; padding: 0;" />
        </div>

        <div style="padding: 10px 14px; border-top: 0.5px solid var(--color-border-tertiary);">
          <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 4px;">email do responsável <span style="color: #791F1F;">*</span></p>
          <input type="text" value="carla.sousa@email.com" style="width: 100%; border: none; font-size: 13.5px; color: #1A1A18; background: transparent; padding: 0;" />
        </div>

      </div>

      <button style="width: 100%; background: #FFFFFF; border: 1px dashed #C9A24B; border-radius: 12px; padding: 11px 0; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 4px;">
        <i class="ti ti-plus" style="font-size: 15px; color: #791F1F;" aria-hidden="true"></i>
        <span style="font-size: 13px; font-weight: 500; color: #791F1F;">adicionar responsável</span>
      </button>

      <p style="font-size: 11px; color: #888780; text-align: center; margin: 16px 0 4px;">
        <span style="color: #791F1F;">*</span> campos obrigatórios — apenas o instagram é opcional
      </p>

    </div>
  </div>
</div>
