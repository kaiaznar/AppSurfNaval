
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 28px 0; display: flex; justify-content: center;">
  <div style="width: 340px; background: #F6F5F1; border-radius: 28px; border: 0.5px solid var(--color-border-tertiary); overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,0.02);">

    <div style="background: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--color-border-tertiary);">
      <i class="ti ti-x" style="font-size: 22px; color: #0A1F3D;" aria-hidden="true"></i>
      <p style="font-size: 15px; font-weight: 500; color: #1A1A18; margin: 0;">criar evento</p>
      <span style="font-size: 13px; font-weight: 700; color: #791F1F;">guardar</span>
    </div>

    <div style="padding: 16px 16px 0; max-height: 600px; overflow-y: auto;">

      <p style="font-size: 11px; color: #6B6A66; font-weight: 600; letter-spacing: 0.4px; margin: 6px 2px 8px;">detalhes do evento</p>
      <div style="background: #FFFFFF; border-radius: 14px; border: 0.5px solid var(--color-border-tertiary); overflow: hidden; margin-bottom: 16px;">

        <div style="padding: 12px 14px;">
          <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 4px;">título do evento</p>
          <input type="text" placeholder="ex: campeonato regional de surf" style="width: 100%; border: none; font-size: 13.5px; color: #1A1A18; background: transparent; padding: 0;" />
        </div>

        <div style="padding: 12px 14px; border-top: 0.5px solid var(--color-border-tertiary);">
          <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 4px;">descrição</p>
          <input type="text" placeholder="detalhes do evento..." style="width: 100%; border: none; font-size: 13.5px; color: #C7C5BC; background: transparent; padding: 0;" />
        </div>

        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 0.5px solid var(--color-border-tertiary);">
          <i class="ti ti-calendar" style="font-size: 17px; color: #6B6A66;" aria-hidden="true"></i>
          <div style="flex: 1;">
            <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 2px;">data</p>
            <p style="font-size: 13.5px; color: #1A1A18; margin: 0;">24/06/2026</p>
          </div>
          <i class="ti ti-chevron-right" style="font-size: 16px; color: #B4B2A9;" aria-hidden="true"></i>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 0.5px solid var(--color-border-tertiary);">
          <i class="ti ti-clock" style="font-size: 17px; color: #6B6A66;" aria-hidden="true"></i>
          <div style="flex: 1;">
            <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 2px;">hora</p>
            <p style="font-size: 13.5px; color: #1A1A18; margin: 0;">15h00 <span style="color:#B4B2A9; font-weight:400;">(pré-preenchida)</span></p>
          </div>
          <i class="ti ti-chevron-right" style="font-size: 16px; color: #B4B2A9;" aria-hidden="true"></i>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 0.5px solid var(--color-border-tertiary);">
          <i class="ti ti-map-pin" style="font-size: 17px; color: #6B6A66;" aria-hidden="true"></i>
          <div style="flex: 1;">
            <p style="font-size: 10.5px; color: #6B6A66; margin: 0 0 2px;">local</p>
            <p style="font-size: 13.5px; color: #C7C5BC; margin: 0;">escolher local...</p>
          </div>
          <i class="ti ti-chevron-right" style="font-size: 16px; color: #B4B2A9;" aria-hidden="true"></i>
        </div>

      </div>

      <p style="font-size: 11px; color: #6B6A66; font-weight: 600; letter-spacing: 0.4px; margin: 0 2px 8px;">quem é notificado</p>
      <div style="background: #FFFFFF; border-radius: 14px; border: 0.5px solid var(--color-border-tertiary); padding: 6px; margin-bottom: 8px; display: flex; gap: 6px;">
        <button style="flex: 1; background: #0A1F3D; border: none; border-radius: 10px; padding: 10px 0; text-align: center;">
          <span style="font-size: 12.5px; font-weight: 600; color: #FFFFFF;">toda a modalidade</span>
        </button>
        <button style="flex: 1; background: transparent; border: none; border-radius: 10px; padding: 10px 0; text-align: center;">
          <span style="font-size: 12.5px; font-weight: 500; color: #6B6A66;">lista de pessoas</span>
        </button>
      </div>
      <p style="font-size: 10.5px; color: #888780; margin: 0 0 18px; padding: 0 2px;">o evento aparece para todos no feed; a notificação é enviada apenas ao grupo escolhido</p>

      <div style="background: #FFFFFF; border-radius: 14px; border: 0.5px solid var(--color-border-tertiary); padding: 16px; margin-bottom: 18px; text-align: center;">
        <p style="font-size: 12px; color: #B4B2A9; margin: 0;">selecionado: surf (todos os atletas)</p>
      </div>

    </div>
  </div>
</div>
